[package]
name = "neotales-vaults-gcp"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
authors = ["x0craft"]
license = "MIT"
description = "Google Cloud Secret Manager provider for neotales-vaults"
repository = "https://github.com/neotales/rs-vaults"
readme = "README.md"

[dependencies]
neotales-vaults-core = { path = "../core", version = "=0.0.0-alpha.0" }
prost = "0.13"
tonic = { version = "0.12", features = ["tls-native-roots"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
url = "2"
crc32c = "0.6"
zeroize = "1.9"

[dev-dependencies]
ureq = "3.5"
base64 = "0.22"
neotales-vaults-local-crypto = { path = "../local-crypto", version = "=0.0.0-alpha.0" }
neotales-vaults-local-json = { path = "../local-json", version = "=0.0.0-alpha.0" }
tempfile = "3"
