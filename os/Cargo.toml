[package]
name = "neotales-vaults-os"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
authors = ["x0craft"]
license = "MIT"
description = "OS credential store provider for neotales-vaults"
repository = "https://github.com/neotales/rs-vaults"
readme = "README.md"

[dependencies]
neotales-vaults-core = { path = "../core", version = "=0.0.0-alpha.0" }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-io", "async-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"
