[package]
name = "neotales-vaults-vaultwarden"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
authors = ["x0craft"]
license = "MIT"
description = "Vaultwarden provider using the Bitwarden CLI"
repository = "https://github.com/neotales/rs-vaults"
readme = "README.md"

[dependencies]
neotales-vaults-core = { path = "../core", version = "=0.0.0-alpha.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = "1"
wait-timeout = "0.2"
zeroize = { version = "1.9", features = ["derive"] }
base64 = "0.22"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
testcontainers = { version = "=0.28.0", features = ["blocking"] }
ureq = "3.5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = "0.3"
rsa = "0.9"
rand = "0.8"
