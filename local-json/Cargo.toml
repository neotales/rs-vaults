[package]
name = "neotales-vaults-local-json"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
authors = ["x0craft"]
license = "MIT"
description = "Versioned JSON vault using a vault-backed encryption key"
repository = "https://github.com/neotales/rs-vaults"
readme = "README.md"

[dependencies]
neotales-vaults-core = { path = "../core", version = "=0.0.0-alpha.0" }
neotales-vaults-local-crypto = { path = "../local-crypto", version = "=0.0.0-alpha.0" }
base64 = "0.22"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
uuid = { version = "1", features = ["v7"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
neotales-vaults = { path = "../vaults", version = "=0.0.0-alpha.0" }
