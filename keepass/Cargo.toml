[package]
name = "neotales-vaults-keepass"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
authors = ["x0craft"]
license = "MIT"
description = "KeePass KDBX provider for neotales-vaults"
repository = "https://github.com/neotales/rs-vaults"
readme = "README.md"

[dependencies]
neotales-vaults-core = { path = "../core", version = "=0.0.0-alpha.0" }
neotales-keepass = "=0.0.0-alpha.1"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-io", "async-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
neotales-vaults = { path = "../vaults", version = "=0.0.0-alpha.0" }
wait-timeout = "0.2"
